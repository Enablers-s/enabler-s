<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enabler-S | Enabling Nations and Enterprises to Grow</title>
  <meta name="description" content="Enabler-S FZE LLC is a Dubai-based global advisory and business execution firm. Eight service pillars, one extended business partner.">
  <link rel="canonical" href="https://enabler-s.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Enabler-S">
  <meta property="og:title" content="Enabler-S | Enabling Nations and Enterprises to Grow">
  <meta property="og:description" content="Enabler-S FZE LLC is a Dubai-based global advisory and business execution firm. Eight service pillars, one extended business partner.">
  <meta property="og:url" content="https://enabler-s.vercel.app/">
  <meta property="og:image" content="https://enabler-s.vercel.app/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#070605">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <!-- Fonts are self-hosted (fonts/enabler.css) so the page never waits on Google -->
  <link rel="preload" href="fonts/files/jost-normal-latin-0428ef.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/files/cormorant-garamond-normal-latin-e99b45.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/enabler.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <!-- Boardroom handshake loop, colour-graded to the brand gold (source: 358512_medium.mp4).
       Fixed behind the whole page, so it carries on behind the contact section too. -->
  <div class="hero-video" aria-hidden="true">
    <video id="hero-video" autoplay muted loop playsinline preload="auto" poster="assets/video/boardroom-poster.jpg">
      <source src="assets/video/boardroom-720.mp4" type="video/mp4" media="(max-width: 900px)">
      <source src="assets/video/boardroom-1080.mp4" type="video/mp4">
    </video>
  </div>

  <header class="top">
    <a class="brand" href="#hero" aria-label="Enabler-S home">
      <img src="assets/logo-mark.png" alt="" width="408" height="512">
      <span>Enabler-S</span>
    </a>
    <nav aria-label="Main">
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <p class="eyebrow">Advisory · Execution · Impact</p>

      <!-- Enabler-S sits at the centre; the eight pillar discs orbit it (positions set in main.js) -->
      <div class="orbit" id="orbit">
        <svg class="orbit-rings" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="49.5"/>
          <circle class="dash" cx="50" cy="50" r="40"/>
          <circle cx="50" cy="50" r="26"/>
        </svg>
        <div class="orbit-core">
          <div class="halo" aria-hidden="true"></div>
          <img src="assets/logo-mark.png" alt="" width="408" height="512">
          <h1 class="wordmark">Enabler<span>-S</span></h1>
        </div>
        <div class="tabs" role="group" aria-label="Enabler-S brands" id="tabs"></div>
      </div>

      <div class="rule" aria-hidden="true"><span></span></div>
      <p class="tagline">Enabling Nations and Enterprises to Grow</p>
      <p class="cue-title" id="cue-title" aria-live="polite"></p>
      <!-- Phones: the orbit is too small for descriptions, so the brands are also listed here (hidden on desktop) -->
      <ul class="brand-list" id="brand-list" aria-label="Enabler-S brands"></ul>
      <a class="scroll-cue" href="#contact">Get in touch <span class="arrow" aria-hidden="true">↓</span></a>
    </section>

  </main>

  <footer class="contact" id="contact">
    <p class="eyebrow">Get in touch</p>
    <h2>Where strategy <em>meets execution</em></h2>
    <dl>
      <div><dt>Email</dt><dd><a id="c-email"></a></dd></div>
      <div><dt>Phone</dt><dd><a id="c-phone"></a></dd></div>
      <div><dt>Office</dt><dd id="c-address"></dd></div>
    </dl>
    <p class="fine">© <span id="year"></span> Enabler-S FZE LLC. All rights reserved.</p>
  </footer>
</body>
</html>
